<!--page: slug=courses; title=الدورات | م. أحمد الديب; desc=الدورات التدريبية: اختر شهادتك من CAPM وPMP وPMI-RMP وPMI-ACP وPMI-CP وPMI-PMOCP، مع حالة كل دورة وزر الحجز أو تسجيل الاهتمام.; nav=courses-->
<main class="page on" id="main">
  <div class="phead"><div class="eyebrow rv">الدورات التدريبية</div><h1 class="rv" style="margin-top:8px">اختر شهادتك، وابدأ <em class="g">مسارك</em></h1></div>
  <section style="padding-top:30px">
    <div class="stagebox"><div class="arc" id="arcC"></div><div class="cinfo" id="infoC"></div><div class="ctl" id="ctlC"></div></div>
    <h2 style="margin-top:60px" class="reveal">كل الدورات</h2>
    <div class="clist" id="clist">
{{#each courses.courses}}<div class="cl reveal"><img src="/assets/badges/{{this.badge}}" alt=""><div><h3>{{this.titleAr}}</h3><small>{{this.subtitleEn}}</small><span class="st {{#ifeq this.status "available"}}ok{{else}}soon{{/ifeq}}">{{@statusAr}}</span><br><a class="btn s" target="_blank" rel="noopener" href="{{site.whatsapp}}">{{@ctaShortAr}}</a>{{#if this.page}} <a class="btn s" href="/courses/{{this.page}}/">تفاصيل الدورة</a>{{/if}}</div></div>
{{/each}}    </div>
  </section>
  <script type="application/json" id="courses-data">{{json courses.courses}}</script>
  <script defer src="/assets/js/carousel.js"></script>
</main>
